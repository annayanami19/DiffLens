[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "difflens"
version = "1.0.0"
description = "DiffLens - aplikasi desktop pembanding dua gambar (slider, berdampingan, kedip, overlay, heatmap perbedaan)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DiffLens contributors" }]
keywords = ["image", "diff", "compare", "gui", "pyside6", "image-comparison"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-image>=0.22.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0.0"]

[project.gui-scripts]
difflens = "app.main:run"

[tool.setuptools]
packages = ["app", "app.views"]
